<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@aretino-chant/editor — Test Cases</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header>
        <h1>@aretino-chant/editor — Test Cases</h1>
        <p>Each <code>aretino</code> block is a live <code>&lt;aretino-editor&gt;</code>. <a href="./">← back to demo</a></p>
    </header>
    <div id="zoom-toolbar">
        <span class="zoom-label">Zoom</span>
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <span id="zoom-value">140%</span>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-reset">Reset</button>
    </div>
    <main id="app"></main>
    <script type="module" src="./test-cases.js"></script>
</body>
</html>
