<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aretino — Test Cases</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header>
        <h1>Aretino Chant — Test Cases</h1>
        <p>Edit <code>dev/test-cases.md</code> to add test cases. Any <code>```aretino</code> block becomes a live editor.</p>
    </header>
    <div id="zoom-toolbar">
        <span class="zoom-label">Zoom</span>
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <span id="zoom-value">140%</span>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-reset">Reset</button>
    </div>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
</body>
</html>
